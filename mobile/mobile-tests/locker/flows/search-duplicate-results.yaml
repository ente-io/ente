# Fixture: sign in with a test account and save one Note in two collections
# whose names share COLLECTION_QUERY. Pass COLLECTION_A, COLLECTION_B,
# NOTE_TITLE and NOTE_CONTENT for those saved items. Use a query with no other
# matches so both collections and the duplicate row fit on screen.
# Run on a portrait phone with the English locale.
appId: io.ente.locker
---
- repeat:
    times: 2
    commands:
      - launchApp
      - tapOn: Search your documents
      - inputText: ${COLLECTION_QUERY}
      - tapOn:
          point: 50%,10%
      - assertVisible: '(?s)${COLLECTION_A}.*'
      - assertVisible: '(?s)${COLLECTION_B}.*'
      - assertVisible: ${NOTE_TITLE}
      - assertNotVisible:
          text: ${NOTE_TITLE}
          index: 1
      - tapOn: ${NOTE_TITLE}
      - assertVisible: ${NOTE_CONTENT}
